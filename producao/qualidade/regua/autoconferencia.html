<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Autoconferência da régua: texto misturado</title>
<style>
  html, body { margin: 0; overflow-x: hidden; font-family: Arial, Helvetica, sans-serif; }
  section { position: relative; height: 96px; }
  span { position: absolute; left: 16px; top: 20px; color: #fff; white-space: nowrap; line-height: 1; }
  .grande { font-size: 48px; font-weight: 700; }
  .miudo { font-size: 16px; }
  .dif { mix-blend-mode: difference; }
</style>
</head>
<body>
  <!-- Fundo branco, branco por diferença: desenha preto (21:1). Pela cor declarada, 1:1. A mistura no pai. -->
  <section style="background:#fff"><div class="dif"><span id="claro" class="grande">Claro</span></div></section>
  <!-- Fundo #808080: desenha #7f7f7f (≈1:1). Não pode aprovar. -->
  <section style="background:#808080"><span id="cinza" class="grande dif">Cinza</span></section>
  <!-- Fundo #555: desenha #aaa (≈3,2:1). Texto grande aprova; o miúdo (mínimo 4,5) reprova. -->
  <section style="background:#555"><span id="medio" class="grande dif">Medio</span></section>
  <section style="background:#555"><span id="miudo" class="miudo dif">Miudo, dezesseis pixels</span></section>
  <!-- Metade branca, metade #808080: a palavra some na metade da direita. Não pode aprovar. -->
  <section style="background:linear-gradient(90deg,#fff 0 110px,#808080 110px)"><span id="partido" class="grande dif">Partido</span></section>
  <!-- Sem mistura: o caminho de antes (a cor declarada), #949494 sobre branco, 16 px: ≈3:1, reprova. -->
  <section style="background:#fff"><span id="normal" class="miudo" style="color:#949494">Normal sem mistura</span></section>
  <!-- A folga do 10º percentil (o crítico, 16.10.2026): "Odontologia" branca por diferença sobre o branco, com a
       fração da direita da largura sobre #808080. Com 10%, o "a" final some e a palavra APROVA (21:1): é o limite
       conhecido, que aguarda o aprovador (com o 5º, reprovaria). Com 12%, reprova. -->
  <section style="background:#fff"><div class="cinza-folga" data-fracao="0.10" style="position:absolute;top:0;bottom:0;right:0;background:#808080"></div><span id="folga10" class="grande dif">Odontologia</span></section>
  <section style="background:#fff"><div class="cinza-folga" data-fracao="0.12" style="position:absolute;top:0;bottom:0;right:0;background:#808080"></div><span id="folga12" class="grande dif">Odontologia</span></section>
  <!-- Caixa de 1 px, misturada, com o texto transbordando à vista: a medida falha, vira aviso. -->
  <section style="background:#fff"><span id="minimo" class="grande dif" style="width:1px;height:1px;overflow:visible">Minimo</span></section>
  <!-- Caixa de 1 px recortada (só para leitor de tela), misturada: não se desenha, fica fora (nem falha nem aviso). -->
  <section style="background:#fff"><span id="leitor" class="miudo dif" style="width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Só para leitor</span></section>
  <!-- Só para leitor de tela dentro de um ancestral girado e misturado (o carimbo do depósito, .dp-carimbo): na tela,
       a caixa de 1 px mede 1,05; recortada, não se desenha e fica fora (nem falha nem aviso). -->
  <section style="background:#fff"><div class="miudo" style="position:absolute;left:16px;top:20px;mix-blend-mode:multiply;rotate:-3deg">Carimbo <span id="girado" style="position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Nº 0000</span></div></section>
  <!-- Misturado e nunca inteiro na tela: vira aviso, nunca aprovação. -->
  <section style="background:#fff"><span id="fora" class="grande dif" style="left:calc(100% - 60px)">Fora da tela</span></section>
  <!-- A mistura que liga depois da primeira tela (a revelação ao rolar, o html[data-palco]): branco sobre #808080.
       Pela cor declarada, aprovaria com 3,95:1; a tela desenha 1,01:1. Não pode aprovar. -->
  <section style="background:#808080"><span id="tarde" class="grande">Tarde</span></section>
  <!-- O texto das figuras (desde 17/10): em SVG e em bloco aria-hidden, a cor declarada sobre o fundo sem a letra. -->
  <!-- Preto em SVG sobre o branco, 16 px: 21:1, aprova. -->
  <section style="background:#fff"><svg width="400" height="96" aria-hidden="true"><text id="fig-preto" x="16" y="50" font-size="16" fill="#000">Figura preta</text></svg></section>
  <!-- #949494 em SVG sobre o branco, 16 px: ≈3:1, abaixo de 4,5. -->
  <section style="background:#fff"><svg width="400" height="96" aria-hidden="true"><text id="fig-cinza" x="16" y="50" font-size="16" fill="#949494">Figura cinza</text></svg></section>
  <!-- O halo de carta: o branco com o contorno preto de 4 px por baixo (paint-order: stroke), sobre o branco. O halo
       é o fundo da letra e aprova; medido sem ele (o contorno sumido junto com a letra), daria 1:1. -->
  <section style="background:#fff"><svg width="400" height="96" aria-hidden="true"><text id="fig-halo" x="16" y="50" font-size="16" font-weight="700" fill="#fff" stroke="#000" stroke-width="4" paint-order="stroke">Halo de carta</text></svg></section>
  <!-- O bloco aria-hidden em HTML: #949494 sobre o branco, 16 px, abaixo. -->
  <section style="background:#fff"><div aria-hidden="true"><span id="fig-html" class="miudo" style="color:#949494">Rotulo em html</span></div></section>
  <!-- A escala da viewBox: 10 unidades × 3 = 30 px, texto grande (mínimo 3); #8a8a8a sobre o branco, 3,45:1, aprova.
       Lido sem a escala (10 px, mínimo 4,5), ficaria abaixo. -->
  <section style="background:#fff"><svg width="400" height="96" viewBox="0 0 133.3 32" aria-hidden="true"><text id="fig-escala" x="5" y="20" font-size="10" fill="#8a8a8a">Escala</text></svg></section>
  <!-- A letra na cor do fundo: nada muda entre as fotos, e a medida cai na caixa inteira (1:1). Não pode aprovar. -->
  <section style="background:#0f2a47"><svg width="400" height="96" aria-hidden="true"><text id="fig-invisivel" x="16" y="50" font-size="16" fill="#0f2a47">Invisivel</text></svg></section>
  <!-- O número em meio-tom (o canvas .valor da leitura), pela média da cobertura: um bloco de 10 × 10 casas de 3 px,
       cada uma com um ponto de 2 × 2 px (a cobertura, no bloco fechado, de 400 / 841 = 0,48). #fbf1de sobre #0f2a47
       dá ≈6,8:1 e aprova; #0f2a47 sobre a névoa #f5f3f0 dá ≈1,8:1, o meio-tom no papel, e fica abaixo. -->
  <section style="background:#0f2a47"><div class="vd-leitura" aria-hidden="true"><canvas id="mt-tela" class="valor meio-tom" width="60" height="40" data-tinta="#fbf1de"></canvas></div></section>
  <section style="background:#f5f3f0"><div class="vd-leitura" aria-hidden="true"><canvas id="mt-papel" class="valor meio-tom" width="60" height="40" data-tinta="#0f2a47"></canvas></div></section>
<script>
  for (const tela of document.querySelectorAll("canvas.meio-tom")) {
    const ctx = tela.getContext("2d");
    ctx.fillStyle = tela.dataset.tinta;
    for (let i = 0; i < 10; i++) for (let j = 0; j < 10; j++) ctx.fillRect(10 + 3 * i, 5 + 3 * j, 2, 2);
  }
  addEventListener("scroll", () => document.getElementById("tarde").classList.add("dif"), { once: true });
  for (const cinza of document.querySelectorAll(".cinza-folga")) {
    const r = cinza.nextElementSibling.getBoundingClientRect();
    cinza.style.left = r.right - Number(cinza.dataset.fracao) * r.width + "px";
  }
</script>
</body>
</html>
